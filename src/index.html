<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Hi, I'm Nic. I'm a frontend engineer with a passion for creating things that are a joy to use."
        />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍💻</text></svg>"
        />
        <link rel="stylesheet" href="./style.css" type="text/css" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
            rel="stylesheet"
        />

        <title>Nic Haynes - Frontend Engineer</title>
    </head>
    <body class="h-svh bg-white dark:bg-gray-950 dark:text-gray-400">
        <div
            id="app"
            class="container sm:px-16 sm:py-8 px-10 max-w-[80ch] overflow-hidden"
        >
            <div
                class="flex items-center size-20 rounded-full overflow-hidden my-10 dark:opacity-60 bg-yellow-500 border-4 border-yellow-500 hover:animate-spin"
            >
                <img
                    src="avatar.png"
                    class="object-cover mix-blend-hard-light"
                />
            </div>

            <div id="intro" class="leading-normal text-3xl my-10">
                <span class="animate-reveal animate-delay-300 font-bold">
                    Hi,
                </span>
                <span class="animate-reveal animate-delay-500 font-bold"
                    >I'm Nic.
                </span>
                <span class="animate-reveal animate-delay-1600">
                    I'm a frontend engineer
                </span>
                <span class="animate-reveal animate-delay-2000">
                    with a passion
                </span>
                <span class="animate-reveal animate-delay-2300">
                    for creating things
                </span>
                <span class="animate-reveal animate-delay-2700">
                    that are a joy to use.
                </span>
            </div>

            <div
                id="projects"
                class="leading-normal mb-5 flex flex-row gap-4 text-lg"
            >
                <span class="font-bold animate-reveal animate-delay-3200"
                    >🧠</span
                >
                <span class="animate-reveal animate-delay-3300">
                    <a href="https://spanner.nicinabox.com/docs">Spanner</a>
                </span>
                <span class="animate-reveal animate-delay-3400">
                    <a href="https://imgzeit.com">Imgzeit</a>
                </span>
                <span class="animate-reveal animate-delay-3500">
                    <a href="https://travel.nicinabox.com">Cairn</a>
                </span>
            </div>

            <div
                id="about"
                class="leading-normal mb-5 flex flex-col gap-5 text-lg"
            >
                <span
                    class="inline-flex gap-4 animate-reveal animate-delay-4000"
                >
                    <span>🧑‍💻</span> Currently at NVIDIA
                </span>
                <span
                    class="inline-flex gap-4 animate-reveal animate-delay-4200"
                >
                    <span>💬</span> Reach out at
                    <a href="mailto:im.nic@hey.com"> im.nic@hey.com </a>
                </span>
            </div>
        </div>

        <script>
            function skipDelay(e) {
                document.body.classList.add("skip-delay");
            }
            window.onkeyup = skipDelay;
            window.onmousedown = skipDelay;
            window.ontouchstart = skipDelay;
        </script>

        <script
            defer
            src="https://analytics.nicinabox.com/script.js"
            data-website-id="f116aed7-5167-42c6-a846-14e728af0c52"
        ></script>
    </body>
</html>
